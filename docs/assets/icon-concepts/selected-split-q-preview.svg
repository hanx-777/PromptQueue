<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Selected PromptQueue Split Q icon</title>
  <desc id="desc">The selected white Split Q icon shown on light and dark browser toolbar backgrounds.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .label { font-size: 12px; font-weight: 700; }
    .size { font-size: 11px; font-weight: 600; }
  </style>

  <rect width="900" height="430" fill="#f4f4f2"/>
  <text x="32" y="46" font-size="27" font-weight="700" fill="#202123">Selected: Split Q / White</text>
  <text x="32" y="73" font-size="14" fill="#6f6f6b">White field, charcoal route, three-provider color endpoints</text>

  <g transform="translate(32 102)">
    <rect width="400" height="292" rx="8" fill="#fafafa" stroke="#d8d8d3"/>
    <text class="label" x="20" y="30" fill="#6f6f6b">LIGHT TOOLBAR</text>
    <image x="38" y="58" width="128" height="128" xlink:href="split-q-128.png"/>
    <image x="211" y="98" width="48" height="48" xlink:href="split-q-48.png"/>
    <image x="310" y="114" width="16" height="16" xlink:href="split-q-16.png"/>
    <text class="size" x="102" y="214" text-anchor="middle" fill="#6f6f6b">128 PX</text>
    <text class="size" x="235" y="168" text-anchor="middle" fill="#6f6f6b">48 PX</text>
    <text class="size" x="318" y="152" text-anchor="middle" fill="#6f6f6b">16 PX</text>
    <text x="20" y="260" font-size="13" fill="#4f4f4b">The neutral border keeps the white field visible.</text>
  </g>

  <g transform="translate(468 102)">
    <rect width="400" height="292" rx="8" fill="#202124"/>
    <text class="label" x="20" y="30" fill="#b4b4b4">DARK TOOLBAR</text>
    <image x="38" y="58" width="128" height="128" xlink:href="split-q-128.png"/>
    <image x="211" y="98" width="48" height="48" xlink:href="split-q-48.png"/>
    <image x="310" y="114" width="16" height="16" xlink:href="split-q-16.png"/>
    <text class="size" x="102" y="214" text-anchor="middle" fill="#b4b4b4">128 PX</text>
    <text class="size" x="235" y="168" text-anchor="middle" fill="#b4b4b4">48 PX</text>
    <text class="size" x="318" y="152" text-anchor="middle" fill="#b4b4b4">16 PX</text>
    <text x="20" y="260" font-size="13" fill="#b4b4b4">The white tile remains distinct at toolbar size.</text>
  </g>
</svg>
